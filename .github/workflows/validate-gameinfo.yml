name: Validate gameinfo

on:
  pull_request:
    paths:
      - gameinfo.json
      - gameinfo.schema.json
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check-jsonschema
        run: pip install check-jsonschema

      - name: Validate gameinfo.json against schema
        run: check-jsonschema --schemafile gameinfo.schema.json gameinfo.json
